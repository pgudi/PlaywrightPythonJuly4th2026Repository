<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function show(){
            for(let i=20;i<=60;i++){
                if(i % 2 ==0){
                    document.write("Even Number :"+i+"<br/>")
                }
            }
        }
    </script>
</head>
<body>
    <h2 align="center">Welcome to Client Side Validation</h2>
    <input type="button" value="Execute Code" onmouseover="show()">
</body>
</html>

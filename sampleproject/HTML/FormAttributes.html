<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Welcome To Form Attributes</h2>
    <fieldset>
        <legend>Form Attributes</legend>
        <form>
            First Name:
            <input type="text" name="firstname" placeholder="Enter First Name" required  autofocus>
            <br>
            <br>
            Middle Name:
            <input type="text" name="middle" placeholder="Enter Middle Name" value="A" readonly>
            <br>
            <br>
            Last Name:
            <input type="text" name="lastname" placeholder="Enter Last Name" maxlength="10" >
            <br>
            <br>
            Address:
            <input type="text" name="address" placeholder="Enter Address" disabled>
            <br>
            <br>
            Age:
            <input type="number" name="age" placeholder="Enter Age" min="18" max="30">
            <br>
            <br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </fieldset>
</body>
</html>
